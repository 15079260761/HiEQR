defaults:
  - "cronquestions_demo.yaml"

paths:
  source_root: "${project.root}/cronquestions_src"
  prompts_root: "${paths.source_root}/prompts"
  # Deliberately retain the completed five-loss experiment artifact root.
  # Retriever/reranker hashes and upstream cache manifests are loss-agnostic,
  # while the changed loss mapping creates a new reasoner stage hash.
  outputs_root: "${project.root}/cronquestions_outputs"

loss:
  answer: 1.0
  ranking: 0.0
  prefix: 0.5
  stop: 0.3
  counterfactual: 0.3

ablation:
  name: "none-main-four-loss-cronquestions"
  active_losses: ["answer", "prefix", "stop", "counterfactual"]
  removed_losses: ["ranking"]
  selection_source: "adjusted-method paper specification"
  weight_normalization: false

experiment:
  name: "main-4loss-cronquestions-10k"
  description: "Paper-aligned CronQuestions four-loss main experiment, 10k training questions"

quality_gate:
  hits1_min: 0.985
  hits10_min: 0.985
