[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decgc-cronquestions"
version = "0.2.1"
description = "Dynamic Evidence Chain Graph Construction for temporal knowledge graph QA"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch>=2.1", "transformers>=4.40", "sentence-transformers>=3.0",
  "accelerate>=0.30", "tokenizers>=0.19", "numpy>=1.26", "pandas>=2.1",
  "pyarrow>=15", "scikit-learn>=1.4", "pyyaml>=6", "python-dotenv>=1",
  "pydantic>=2.6", "jinja2>=3.1", "openai>=1.30", "tqdm>=4.66",
  "rich>=13.7", "tensorboard>=2.16", "orjson>=3.10", "filelock>=3.14",
  "typer>=0.12"
]

[project.scripts]
decgc-cron = "decgc.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["decgc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
