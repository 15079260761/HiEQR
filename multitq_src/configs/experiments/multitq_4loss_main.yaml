defaults:
  - "multitq_demo.yaml"

paths:
  source_root: "${project.root}/multitq_src"
  prompts_root: "${paths.source_root}/prompts"

# Human-readable level before the immutable stage hash:
# outputs/runs/<stage>/<experiment.name>/multitq-<hash>/
experiment:
  name: "main-4loss-multitq-10k"
  description: "Paper-aligned MultiTQ four-loss main experiment, 10k training questions"

# Paper-aligned objective: L_prefix + L_stop + L_answer + L_cf.
loss:
  answer: 1.0
  ranking: 0.0
  prefix: 0.5
  stop: 0.3
  counterfactual: 0.3

ablation:
  name: "none-main-four-loss-multitq"
  active_losses: ["answer", "prefix", "stop", "counterfactual"]
  removed_losses: ["ranking"]
  selection_source: "adjusted-method paper specification"
  weight_normalization: false
